
name: Refresh METI news

on:
  workflow_dispatch:
  schedule:
    # UTC schedules corresponding to Mon-Fri 00:17-21:17 in Japan.
    - cron: '17 0,3,6,9,12 * * 1-5'
    - cron: '17 15,18,21 * * 0-4'
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  business-day:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      run: ${{ steps.calendar.outputs.run }}
    steps:
      - name: Check Japanese business day
        id: calendar
        shell: python
        run: |
          import csv
          import io
          import os
          import time
          from datetime import datetime
          from urllib.request import urlopen
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Tokyo")).date()
          allowed = False
          reason = "Weekend in Japan"
          if today.weekday() < 5:
              url = "https://www8.cao.go.jp/chosei/shukujitsu/syukujitsu.csv"
              for attempt in range(3):
                  try:
                      with urlopen(url, timeout=20) as response:
                          rows = csv.reader(io.StringIO(response.read().decode("cp932")))
                          next(rows)
                          holidays = {
                              datetime.strptime(row[0], "%Y/%m/%d").date()
                              for row in rows if row and row[0].strip()
                          }
                      if not any(day.year == today.year for day in holidays):
                          raise ValueError("Holiday data does not cover the current year")
                      allowed = today not in holidays
                      reason = "Japanese business day" if allowed else "Japanese public holiday"
                      break
                  except Exception as exc:
                      if attempt < 2:
                          time.sleep(5)
                      else:
                          reason = "Holiday calendar unavailable; skipping publication"
                          print(f"::warning::{reason}: {exc}")
          print(f"{today}: {reason}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"run={str(allowed).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"{today} (Asia/Tokyo): {reason}\n")

  publish:
    needs: business-day
    if: needs.business-day.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch METI releases and generate website
        run: python3 fetch_meti.py
      - uses: actions/configure-pages@v5
      - id: pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for Pages artifact availability
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        shell: python
        run: |
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          artifact_id = int(os.environ["EXPECTED_ARTIFACT_ID"])
          url = (
              f'{os.environ["GITHUB_API_URL"]}/repos/{os.environ["GITHUB_REPOSITORY"]}'
              f'/actions/runs/{os.environ["GITHUB_RUN_ID"]}/artifacts?name=github-pages&per_page=100'
          )
          request = Request(url, headers={
              "Authorization": f'Bearer {os.environ["GH_TOKEN"]}',
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          for attempt in range(1, 7):
              try:
                  with urlopen(request, timeout=10) as response:
                      artifacts = json.load(response)["artifacts"]
                  ready = any(
                      item["id"] == artifact_id
                      and item["name"] == "github-pages"
                      and not item.get("expired", False)
                      and item.get("size_in_bytes", 0) > 0
                      for item in artifacts
                  )
                  if ready:
                      # deploy-pages uses a different artifact service; allow propagation.
                      print(f"Artifact {artifact_id} is visible; allowing 10 seconds to settle.")
                      time.sleep(10)
                      break
                  print(f"Artifact {artifact_id} not visible yet (attempt {attempt}/6).")
              except HTTPError as exc:
                  if exc.code not in (429, 500, 502, 503, 504):
                      raise
                  print(f"Temporary API error HTTP {exc.code} (attempt {attempt}/6).")
              except (URLError, TimeoutError):
                  print(f"Temporary network error (attempt {attempt}/6).")
              if attempt == 6:
                  raise RuntimeError(f"Artifact {artifact_id} unavailable after 6 checks")
              time.sleep(10)
      - id: deployment
        uses: actions/deploy-pages@v4

